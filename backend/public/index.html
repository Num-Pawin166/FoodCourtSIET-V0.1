<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FoodCourt SIET · หลังบ้าน</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23e5437f'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3EF%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- หน้า login -->
  <section id="login-view" class="login hidden">
    <form id="login-form" class="login-card">
      <img class="logo-img big" src="logo.png" alt="Food Court SIET" />
      <p class="muted">ระบบหลังบ้านสำหรับร้านค้าและผู้ดูแล</p>
      <label>ชื่อผู้ใช้<input name="username" autocomplete="username" required /></label>
      <label>รหัสผ่าน<input name="password" type="password" autocomplete="current-password" required /></label>
      <p id="login-error" class="error"></p>
      <button class="btn primary block">เข้าสู่ระบบ</button>
      <p class="hint">ทดลอง: <code>admin / admin1234</code> · ร้าน <code>shopa / 1234</code></p>
    </form>
  </section>

  <!-- แอปหลังบ้าน -->
  <section id="app-view" class="shell hidden">
    <aside class="sidebar">
      <img class="logo-img" src="logo.png" alt="Food Court SIET" />
      <div id="who" class="who"></div>
      <nav id="nav"></nav>
      <button id="logout" class="btn ghost block">ออกจากระบบ</button>
    </aside>
    <main id="main"></main>
  </section>

  <dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
